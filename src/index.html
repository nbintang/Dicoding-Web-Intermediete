<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>StoryBoard - SPA</title>
    <meta name="map-tiler-key" content="" />
    <meta
      name="description"
      content="Aplikasi Story SPA untuk membuat dan berbagi cerita di peta interaktif"
    />
    <meta name="theme-color" content="#6366f1" />

    <!-- PWA Manifest (FIXED PATH) -->
    <link rel="manifest" href="/public/manifest.webmanifest" />

    <!-- Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StoryBoard" />
    <link rel="apple-touch-icon" href="/public/favicon.png" />

    <!-- Styles & Icons -->
    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="icon" href="/public/favicon.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>

  <body>
    <a class="skip-link" href="#main">Lewati ke konten utama</a>

    <header id="app-header" role="banner">
      <div class="logo-area">
        <img src="/public/favicon.png" alt="Logo StoryBoard" width="40" height="40" />
        <span class="logo-text">StoryBoard</span>
      </div>

      <nav id="app-nav" role="navigation" aria-label="Navigasi utama"></nav>
    </header>

    <section class="intro-accessible">
      <h1>Peta Interaktif untuk Cerita Kamu</h1>
      <h2>
        Aplikasi ini memungkinkan kamu membuat, melihat, dan menyimpan cerita
        langsung di atas peta. Semua dirender secara SPA tanpa reload halaman.
      </h2>
    </section>

    <main id="main" role="main" tabindex="-1" aria-live="polite"></main>

    <footer id="app-footer" role="contentinfo">
      <p>&copy; 2025 StoryBoard</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
